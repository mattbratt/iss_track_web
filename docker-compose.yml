# ISS Track (web) behind a Cloudflare Tunnel. Copy this file and .env.example
# (renamed to .env, with your tunnel token) into one folder, then
# "docker compose up -d", or create a Container Manager project from the
# folder on a Synology NAS.
services:
  iss_track_web:
    image: ghcr.io/mattbratt/iss_track_web:latest
    # Fetch the newest image on every start. Without this a host that already
    # holds "latest" keeps reusing it, and Synology's Container Manager never
    # checks this registry for a newer one.
    pull_policy: always
    container_name: iss_track_web
    restart: unless-stopped
    environment:
      # Behind the tunnel, request limits apply per visitor, not per tunnel.
      ISS_TRACK_TRUST_PROXY: "1"
    volumes:
      # The last good orbital elements, kept across restarts. Create the
      # data folder before the first start: Synology's Docker does not make
      # a missing bind-mount folder, and the start fails without it.
      - ./data:/data
    ports:
      # Reachable on your own network as well, at http://<host>:8765
      - "8765:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: iss_track_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - iss_track_web
